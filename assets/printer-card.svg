<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-label="Printer Card">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- scanner lid -->
  <rect x="28" y="20" width="100" height="22" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
  <!-- output gap the page comes out of -->
  <rect x="34" y="44" width="90" height="13" rx="4" fill="#1d4ed8"/>
  <!-- body -->
  <rect x="24" y="56" width="108" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
  <!-- paper drawer and plinth -->
  <rect x="32" y="112" width="92" height="17" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
  <rect x="66" y="132" width="24" height="6" rx="3" fill="#1d4ed8"/>

  <!-- the sheet, half out of the gap and draped over the front -->
  <rect x="52" y="46" width="52" height="60" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <g fill="#2563eb" opacity="0.55">
    <rect x="62" y="63" width="32" height="6" rx="3"/>
    <rect x="62" y="77" width="32" height="6" rx="3"/>
    <rect x="62" y="91" width="18" height="6" rx="3"/>
  </g>

  <!-- control panel and its LED -->
  <rect x="106" y="66" width="20" height="14" rx="4" fill="#1d4ed8"/>
  <circle cx="112" cy="73" r="3.5" fill="url(#ink)"/>

  <text x="154" y="77" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#1e3a8a">Printer</text>
  <text x="154" y="121" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#2563eb">Card</text>
</svg>
