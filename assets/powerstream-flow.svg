<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-label="PowerStream Flow Card">
  <!-- Solar panel -->
  <g stroke="#2563eb" stroke-width="6" fill="#dbeafe" stroke-linejoin="round">
    <rect x="26" y="26" width="76" height="52" rx="8"/>
  </g>
  <g stroke="#2563eb" stroke-width="3.4">
    <line x1="51" y1="28" x2="51" y2="76"/>
    <line x1="77" y1="28" x2="77" y2="76"/>
    <line x1="28" y1="52" x2="100" y2="52"/>
  </g>
  <!-- Flow arrow with energy bolt -->
  <path d="M108 96 q24 34 48 34" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 84 l-6 22 h12 l-6 22" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Battery -->
  <g stroke="#2563eb" stroke-width="6" stroke-linejoin="round">
    <rect x="72" y="108" width="64" height="34" rx="8" fill="#dbeafe"/>
    <rect x="136" y="118" width="8" height="14" rx="3" fill="#2563eb"/>
  </g>
  <rect x="79" y="115" width="34" height="20" rx="4" fill="#2563eb"/>
  <text x="164" y="77" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#1e3a8a">PowerStream</text>
  <text x="164" y="121" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#2563eb">Flow</text>
</svg>
