<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-label="Illustrated Energy Flow Card">
  <defs>
    <linearGradient id="ef-flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- a solar panel, seen slightly from the side -->
  <path d="M20 30 L98 20 L107 54 L29 64 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" opacity="0.8">
    <line x1="46" y1="26" x2="54" y2="60"/>
    <line x1="72" y1="23" x2="81" y2="57"/>
    <line x1="24" y1="47" x2="103" y2="37"/>
  </g>

  <!-- its own flow, running down to the house -->
  <g fill="url(#ef-flow)">
    <circle cx="84" cy="66" r="5.5"/>
    <circle cx="99" cy="75" r="4.5"/>
    <circle cx="113" cy="83" r="3.5"/>
  </g>

  <!-- the house it feeds -->
  <path d="M120 82 L164 118 V148 H76 V118 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="6" stroke-linejoin="round"/>
  <rect x="110" y="126" width="21" height="22" rx="3" fill="#1d4ed8"/>

  <text x="186" y="77" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#1e3a8a">Energy</text>
  <text x="186" y="121" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#2563eb">Flow</text>
</svg>
